
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp CRM</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<!-- LEFT PANEL -->
<div class="sidebar">

<div class="sidebar-header">
<h3>Contacts</h3>
<button class="csv">Upload CSV</button>
</div>

<label class="selectall">
<input type="checkbox"> Select All
</label>

<div id="contacts">

<div class="contact" onclick="openChat('Vivek')">
Vivek (7020492191)
</div>

<div class="contact" onclick="openChat('Mahesh')">
Mahesh (8983823834)
</div>

<div class="contact" onclick="openChat('Babu')">
Babu (9011750986)
</div>

</div>


<div class="templates">

<h3>Templates Approved</h3>

<select id="templateList">
<option>Offer Template</option>
<option>Reminder Template</option>
</select>

<div class="preview">

<h4>Template Preview</h4>

<label>Header</label>
<input type="text">

<label>Body</label>
<textarea></textarea>

<label>Footer</label>
<input type="text">

</div>

<button class="sendTemplate">
Send To Selected Contacts
</button>

</div>

</div>



<!-- RIGHT PANEL -->

<div class="chat">

<div class="chat-header">

<h3 id="chatName">Chat Inbox</h3>

<button class="logout">Logout</button>

</div>

<div id="messages" class="messages"></div>

<div class="chat-input">

<input id="msgInput" placeholder="Type message">

<input type="file">

<button onclick="sendMsg()">Send Msg</button>

</div>


<div class="result">

<h4>Template Result</h4>

Send ( ) <br>
Delivered ( ) <br>
Read ( )

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
