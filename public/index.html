<!DOCTYPE html>
<html>
<head>
<title>WhatsApp CRM</title>

<style>

body{
font-family:Arial;
margin:0;
}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:30%;
border-right:1px solid #ccc;
padding:10px;
overflow-y:auto;
}

.chat{
flex:1;
padding:10px;
display:flex;
flex-direction:column;
}

#messages{
height:65vh;
overflow-y:auto;
border:1px solid #ddd;
padding:10px;
background:#fafafa;
margin-bottom:10px;
}

.contact{
cursor:pointer;
padding:6px;
border-bottom:1px solid #eee;
}

</style>
</head>

<body>

<script>
if(localStorage.getItem("login")!=="ok"){
location.href="/login.html"
}
</script>

<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ddd">
<h2>WhatsApp CRM</h2>
<button onclick="logout()">Logout</button>
</div>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>Add Contact</h3>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="addContact()">Add</button>

<hr>

<h3>Upload CSV</h3>

<input type="file" id="csv"><br><br>
<button onclick="uploadCSV()">Upload</button>

<hr>

<h3>Contacts</h3>

<label>
<input type="checkbox" onclick="selectAllContacts(this)"> Select All
</label>

<br><br>

<input id="search" placeholder="Search contact..." onkeyup="searchContacts()" style="width:100%;padding:6px">

<br><br>

<div id="contacts"></div>

<hr>

<h3>Template Campaign</h3>

Template:

<select id="templateDropdown">
<option value="">Select Template</option>
</select>

<button onclick="loadTemplates()">Load</button>

<br><br>

Delay (seconds):
<input id="delaySeconds" value="2" style="width:60px">

<br><br>

Param1:<input id="p1"><br>
Param2:<input id="p2"><br>
Param3:<input id="p3"><br>
Param4:<input id="p4"><br><br>

<button onclick="sendTemplateToSelected()">
Send Template to Selected
</button>

</div>

<!-- CHAT AREA -->

<div class="chat">

<h3 id="chatTitle">Chat</h3>

<div id="messages"></div>

<input id="msg" placeholder="Type message">

<button onclick="send()">Send</button>

<br><br>

<input type="file" id="file">

<button onclick="sendFile()">Send File</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
