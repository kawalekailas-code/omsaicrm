
<!DOCTYPE html>
<html>
<head>
<style>
body{font-family:Arial}
.container{display:flex;height:100vh}
.sidebar{width:30%;border-right:1px solid #ccc;padding:10px}
.chat{flex:1;padding:10px;display:flex;flex-direction:column}

#messages{
 height:65vh;
 overflow-y:auto;
 border:1px solid #ddd;
 padding:10px;
 background:#fafafa;
 margin-bottom:10px;
}

.contact{
 cursor:pointer;
 padding:6px;
 border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("login")!=="ok"){
 location.href="/login.html"
}
</script>

<h2>WhatsApp CRM</h2>

<div class="container">

<div class="sidebar">

<h3>Add Contact</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="addContact()">Add</button>

<h3>Upload CSV</h3>
<input type="file" id="csv">
<button onclick="uploadCSV()">Upload</button>

<h3>Contacts</h3>
<input id="search" placeholder="Search contact..." onkeyup="searchContacts()" style="width:100%;padding:6px;margin-bottom:8px;">
<div id="contacts">
<hr>
<h3>Template Campaign</h3>

Template:
<input id="template"><br><br>

Param1:<input id="p1"><br>
Param2:<input id="p2"><br>
Param3:<input id="p3"><br>
Param4:<input id="p4"><br><br>

<button onclick="sendTemplateToSelected()">Send Template to Selected Contacts</button>

</div>

</div>

<div class="chat">

<h3 id="chatTitle">Chat</h3>
<div id="messages"></div>

<input id="msg">
<button onclick="send()">Send</button>

<br><br>

<input type="file" id="file">
<button onclick="sendFile()">Send File</button>


<hr>
<h3>Template Campaign</h3>

Template:
<input id="template"><br><br>

Param1:<input id="p1"><br>
Param2:<input id="p2"><br>
Param3:<input id="p3"><br>
Param4:<input id="p4"><br><br>

<button onclick="sendTemplateToSelected()">Send Template to Selected Contacts</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
