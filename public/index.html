
<!DOCTYPE html>
<html>
<head>
<style>
body{font-family:Arial}
.container{display:flex;height:100vh}
.sidebar{width:30%;border-right:1px solid #ccc;padding:10px}
.chat{flex:1;padding:10px;display:flex;flex-direction:column}

#messages{
 height:65vh;
 overflow-y:auto;
 border:1px solid #ddd;
 padding:10px;
 background:#fafafa;
 margin-bottom:10px;
}

.contact{
 cursor:pointer;
 padding:6px;
 border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("login")!=="ok"){
 location.href="/login.html"
}
</script>

<div style="display:flex;justify-content:space-between;align-items:center"><h2>WhatsApp CRM</h2><button onclick="logout()">Logout</button></div></h2>

<div class="container">

<div class="sidebar">

<h3>Add Contact</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="addContact()">Add</button>

<h3>Upload CSV</h3>
<input type="file" id="csv">
<button onclick="uploadCSV()">Upload</button>

<h3>Contacts</h3>
<label><input type="checkbox" onclick="selectAllContacts(this)"> Select All</label>
<input id="search" placeholder="Search contact..." onkeyup="searchContacts()" style="width:100%;padding:6px;margin-bottom:8px;">
<div id="contacts">
<hr>


</div>

</div>

<script src="app.js"></script>


<div style="position:absolute;left:420px;top:60px;width:650px">

<h3>Chat Inbox</h3>
<div id="messages" style="height:350px;border:1px solid #ccc;overflow-y:scroll;padding:10px;margin-bottom:10px;background:#fafafa"></div>

<input id="messageInput" placeholder="Type message" style="width:70%;padding:6px">
<button onclick="sendMessage()">Send</button>

<br><br>

<input type="file" id="mediaFile">
<button onclick="sendMedia()">Send Media</button>

<hr>

<h3>Template Campaign</h3>

<button onclick="loadTemplates()">Load Templates</button><br><br>

Template:
<select id="templateDropdown"></select>

<h4>Template Preview</h4>
<div id="templatePreview" style="border:1px solid #ccc;padding:8px;margin-bottom:10px"></div>

Delay (seconds):
<input id="delaySeconds" value="2" style="width:60px">

<br><br>
<button onclick="sendTemplateCampaign()">Send Template Campaign</button>

</div>

</body>
</html>
